[package]
name = "awstate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.13.2"
aws-credential-types = "1.3.1"
aws-sdk-autoscaling = "1.144.0"
aws-sdk-cloudwatch = "1.143.0"
aws-sdk-cloudwatchlogs = "1.165.0"
aws-sdk-ecr = "1.141.0"
aws-sdk-ecs = "1.160.0"
aws-sdk-elasticache = "1.131.0"
aws-sdk-rds = "1.162.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
